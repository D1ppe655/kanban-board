<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Канбан-доска</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; margin: 20px; }
        .board { display: flex; gap: 20px; }
        .column { background: #e2e4e6; border-radius: 5px; padding: 10px; width: 30%; min-height: 300px; }
        .task { background: white; padding: 10px; margin-bottom: 10px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .btn { padding: 5px 10px; cursor: pointer; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <h2>Локальная канбан-доска</h2>
    
    <!-- Форма добавления -->
    <input type="text" id="taskTitle" placeholder="Новая задача">
    <button class="btn" onclick="addTask()">Добавить</button>

    <div class="board" style="margin-top: 20px;">
        <div class="column" id="todo"><h3>To Do</h3></div>
        <div class="column" id="in_progress"><h3>In Progress</h3></div>
        <div class="column" id="done"><h3>Done</h3></div>
    </div>

    <script>
        async function loadTasks() {
            const res = await fetch('/tasks');
            const tasks = await res.json();
            
            // Очистка колонок
            document.querySelectorAll('.column').forEach(col => col.innerHTML = col.querySelector('h3').outerHTML);
            
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task';
                div.innerHTML = `<b>${task.title}</b><br>
                    <button class="btn" onclick="moveTask(${task.id}, 'todo')">To Do</button>
                    <button class="btn" onclick="moveTask(${task.id}, 'in_progress')">В работе</button>
                    <button class="btn" onclick="moveTask(${task.id}, 'done')">Готово</button>`;
                document.getElementById(task.status).appendChild(div);
            });
        }

        async function addTask() {
            const title = document.getElementById('taskTitle').value;
            if (!title) { alert("Введите название"); return; }
            
            const res = await fetch('/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: title})
            });
            if (res.ok) {
                document.getElementById('taskTitle').value = '';
                loadTasks();
            } else {
                const err = await res.json();
                alert(err.detail);
            }
        }

        async function moveTask(id, status) {
            await fetch(`/tasks/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            loadTasks();
        }

        loadTasks();
    </script>
</body>
</html>
